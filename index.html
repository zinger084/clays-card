<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3efe4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="8-Man">
<title>8-Man Clays</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --paper: #f3efe4;
    --card: #fffdf8;
    --ink: #1c1915;
    --muted: #6d665c;
    --line: #e4ddd0;
    --orange: #b62c00;
    --orange-ink: #fff8f4;
    --green: #146c36;
    --green-bg: #e5f6eb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #e7e0d4;
    color: var(--ink);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button, input { font: inherit; color: inherit; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .wrap {
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--paper);
  }
  .sticky {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--paper);
    padding: calc(10px + env(safe-area-inset-top)) 14px 8px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 650;
  }
  .standnav {
    display: grid;
    grid-template-columns: minmax(0, 72px) minmax(0, 1fr) minmax(0, 72px);
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .standnav .jump {
    width: 100%;
    min-width: 0;
    height: 48px;
    padding: 0;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 12px;
    font-weight: 700;
  }
  .standmid { text-align: center; }
  .standnum { font-size: 40px; line-height: 1; font-weight: 750; letter-spacing: -0.03em; }
  .standof { color: var(--muted); font-size: 14px; }
  .dots { display: flex; gap: 3px; margin-top: 8px; }
  .dots button { flex: 1; height: 28px; padding: 0; border: 0; background: transparent; }
  .dots i {
    display: block;
    width: 8px;
    height: 8px;
    margin: 0 auto;
    border-radius: 50%;
    background: #d3cbc0;
  }
  .dots i.partial { background: #e0a15a; }
  .dots i.full { background: var(--orange); }
  .dots i.current { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  main { padding: 12px 12px calc(108px + env(safe-area-inset-bottom)); }
  .pagehead { padding: calc(14px + env(safe-area-inset-top)) 4px 4px; }
  .pagehead h1 { margin: 0; font-size: 28px; letter-spacing: -0.03em; }
  .pagehead p { margin: 4px 0 0; color: var(--muted); }
  .group { margin: 0 0 16px; }
  .group h2 {
    margin: 14px 4px 8px;
    font-size: 18px;
    letter-spacing: -0.02em;
  }
  .shooter, .row, .person, .note, .teamwrap {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .shooter { padding: 10px 10px 8px; margin-bottom: 8px; }
  .who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .who strong { font-size: 20px; letter-spacing: -0.02em; }
  .who .run { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 750; font-size: 20px; }
  .who .run.empty { color: #c0b8ac; font-weight: 500; }
  .nums { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .nums button {
    min-width: 0;
    width: 100%;
    height: 46px;
    padding: 0;
    border-radius: 10px;
    border: 1px solid #d9d1c4;
    background: #fff;
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .nums button.on { background: var(--orange); color: var(--orange-ink); border-color: var(--orange); }
  .hint { margin: 2px 4px 0; color: var(--muted); font-size: 13px; }
  .section { margin-top: 16px; }
  .section h2 { margin: 0 4px 8px; font-size: 18px; }
  .row, .person { padding: 12px 14px; margin-bottom: 8px; }
  .row.win { background: var(--green-bg); border-color: #b7e0c4; }
  .row.lead { border-color: #efc7b8; }
  .topline { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .name { font-size: 20px; font-weight: 750; letter-spacing: -0.02em; }
  .pill {
    flex: none;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.04em;
    border-radius: 999px;
    padding: 3px 8px;
  }
  .pill.win { background: var(--green); color: white; }
  .pill.lead { background: var(--orange); color: white; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .note { padding: 12px 14px; color: var(--muted); margin-top: 8px; }
  .teamwrap { margin-bottom: 8px; }
  .team, .person .nm {
    width: 100%;
    border: 0;
    background: transparent;
    font-size: 22px;
    font-weight: 750;
    padding: 0;
  }
  .team { display: block; padding: 12px 14px; }
  .team::placeholder, .person .nm::placeholder { color: #b0a89c; font-weight: 650; }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .actions button {
    display: block;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    font-weight: 700;
  }
  .actions .danger { color: #8d1d1d; }
  .tabs {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: #fffdf8;
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (min-width: 700px) {
    .tabs { left: 50%; right: auto; width: 480px; transform: translateX(-50%); }
  }
  .tabs a {
    min-width: 0;
    text-align: center;
    text-decoration: none;
    color: var(--muted);
    font-weight: 750;
    padding: 14px 0 12px;
  }
  .tabs a.on { color: var(--orange); box-shadow: inset 0 3px 0 var(--orange); }
</style>
</head>
<body>
<div class="wrap">
  <main id="app"></main>
</div>
<nav class="tabs" aria-label="Sections">
  <a href="#score" id="tab-score">Score</a>
  <a href="#results" id="tab-results">Results</a>
  <a href="#names" id="tab-names">Names</a>
</nav>
<script>
const KEY = "clays8-v2";
const OLD_KEY = "clays8-v1";
const N = 8;
const TEAM = 4;
const STANDS = 18;
const MAX_HITS = 6;
const params = new URLSearchParams(location.search);
const TEST = params.has("test");

function fresh() {
  return {
    version: 2,
    teams: ["", ""],
    names: Array(N).fill(""),
    scores: Array.from({ length: N }, () => Array(STANDS).fill(null)),
    stand: 0
  };
}
function clamp(n, lo, hi, fallback) {
  const v = Number(n);
  if (!Number.isFinite(v)) return fallback;
  return Math.min(hi, Math.max(lo, Math.round(v)));
}
function readScores(state, rows) {
  if (!Array.isArray(rows)) return;
  rows.slice(0, N).forEach((row, i) => {
    if (!Array.isArray(row)) return;
    for (let st = 0; st < STANDS; st++) {
      const v = row[st];
      if (v === null || v === undefined || v === "") continue;
      const n = Number(v);
      if (Number.isInteger(n) && n >= 0 && n <= MAX_HITS) state.scores[i][st] = n;
    }
  });
}
function sanitize(saved) {
  const state = fresh();
  if (!saved || (saved.version !== 1 && saved.version !== 2)) return state;
  state.stand = clamp(saved.stand, 0, STANDS - 1, 0);
  if (Array.isArray(saved.teams)) {
    saved.teams.slice(0, 2).forEach((name, i) => {
      state.teams[i] = String(name || "").slice(0, 24);
    });
  }
  if (Array.isArray(saved.names)) {
    saved.names.slice(0, N).forEach((name, i) => {
      state.names[i] = String(name || "").slice(0, 24);
    });
  } else if (Array.isArray(saved.shooters)) {
    saved.shooters.slice(0, N).forEach((sh, i) => {
      state.names[i] = String(sh && sh.name || "").slice(0, 24);
    });
  }
  readScores(state, saved.scores);
  return state;
}
function load() {
  if (TEST) return fresh();
  try {
    const next = localStorage.getItem(KEY);
    if (next) return sanitize(JSON.parse(next));
    const old = localStorage.getItem(OLD_KEY);
    if (old) return sanitize(JSON.parse(old));
    return fresh();
  } catch (e) { return fresh(); }
}
let state = load();
function save() {
  if (TEST) return;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* private mode */ }
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function teamOf(i) { return i < TEAM ? 0 : 1; }
function teamMembers(t) { return [0, 1, 2, 3].map((k) => t * TEAM + k); }
function displayTeam(t) { return (state.teams[t] || "").trim() || ("Team " + (t + 1)); }
function displayName(i) { return (state.names[i] || "").trim() || ("Shooter " + (i + 1)); }
function entered(i) { return state.scores[i].filter((v) => v !== null).length; }
function raw(i) { return state.scores[i].reduce((sum, v) => sum + (v == null ? 0 : v), 0); }
function cardDone(i) { return entered(i) === STANDS; }
function allDone() { return state.names.every((_, i) => cardDone(i)); }
function standStatus(st) {
  const n = state.scores.filter((row) => row[st] != null).length;
  if (n === 0) return "empty";
  if (n === N) return "full";
  return "partial";
}
function board() {
  const rows = state.names.map((_, i) => ({
    i,
    name: displayName(i),
    team: displayTeam(teamOf(i)),
    hits: raw(i),
    birds: entered(i)
  }));
  rows.sort((a, b) => (b.birds > 0) - (a.birds > 0) || b.hits - a.hits || a.name.localeCompare(b.name));
  const final = allDone();
  const scored = rows.filter((r) => r.birds > 0);
  const max = scored.length ? Math.max(...scored.map((r) => r.hits)) : null;
  const finalMax = final ? Math.max(...rows.map((r) => r.hits)) : null;
  const counts = new Set(rows.map((r) => r.birds));
  rows.forEach((r) => {
    r.win = final && r.hits === finalMax;
    r.lead = !final && r.birds > 0 && r.hits === max;
  });
  return { rows, final, uneven: counts.size > 1 && scored.length > 0 };
}
function teamBoard() {
  const rows = [0, 1].map((t) => {
    const men = teamMembers(t);
    return {
      t,
      name: displayTeam(t),
      names: men.map(displayName),
      hits: men.reduce((sum, i) => sum + raw(i), 0),
      birds: men.reduce((sum, i) => sum + entered(i), 0),
      done: men.every(cardDone)
    };
  });
  const final = rows.every((r) => r.done);
  const scored = rows.filter((r) => r.birds > 0);
  const max = scored.length ? Math.max(...scored.map((r) => r.hits)) : null;
  const finalMax = final ? Math.max(...rows.map((r) => r.hits)) : null;
  const counts = new Set(rows.map((r) => r.birds));
  rows.forEach((r) => {
    r.win = final && r.hits === finalMax;
    r.lead = !final && r.birds > 0 && r.hits === max;
  });
  return { rows, final, uneven: counts.size > 1 && scored.length > 0 };
}
function shareText() {
  const people = board();
  const teams = teamBoard();
  const finished = Array.from({ length: STANDS }, (_, st) => standStatus(st) === "full").filter(Boolean).length;
  const lines = ["8-man sporting clays", finished + " of 18 stands filled for everyone", ""];
  if (teams.final) {
    lines.push("Team WIN: " + teams.rows.filter((r) => r.win).map((r) => r.name + " " + r.hits).join(", "));
  } else {
    lines.push("Teams so far");
  }
  teams.rows.forEach((r) => lines.push(r.name + "  " + r.hits));
  lines.push("");
  if (people.final) {
    lines.push("WIN: " + people.rows.filter((r) => r.win).map((r) => r.name + " " + r.hits).join(", "));
  } else {
    lines.push("Shooters so far");
  }
  people.rows.forEach((r) => {
    if (!r.birds) return;
    lines.push(r.name + "  " + r.hits);
  });
  if (!people.final) lines.push("", "Winners wait until all 18 stands are in.");
  return lines.join("\n");
}

function tabName() {
  const name = (location.hash || "#score").replace("#", "");
  if (name === "squad") return "names";
  return ["score", "results", "names"].includes(name) ? name : "score";
}
function setTabs() {
  ["score", "results", "names"].forEach((name) => {
    document.getElementById("tab-" + name).classList.toggle("on", name === tabName());
  });
}
function shooterCard(i, stand) {
  const value = state.scores[i][stand];
  const birds = entered(i);
  const nums = Array.from({ length: MAX_HITS + 1 }, (__, n) => {
    const on = value === n ? " on" : "";
    return '<button type="button" class="' + on + '" data-act="hit" data-i="' + i + '" data-n="' + n + '" aria-pressed="' + (value === n) + '" aria-label="' + esc(displayName(i)) + " stand " + (stand + 1) + ", " + n + ' hits">' + n + "</button>";
  }).join("");
  const run = birds ? String(raw(i)) : "·";
  return '<article class="shooter"><div class="who"><strong>' + esc(displayName(i)) + '</strong><span class="run' + (birds ? "" : " empty") + '">' + run + "</span></div><div class=\"nums\">" + nums + "</div></article>";
}
function renderScore() {
  const stand = state.stand;
  const dots = Array.from({ length: STANDS }, (_, st) => {
    const status = standStatus(st);
    const current = st === stand ? " current" : "";
    return '<button type="button" data-act="goto" data-stand="' + st + '" aria-label="Stand ' + (st + 1) + '"><i class="' + status + current + '"></i></button>';
  }).join("");
  const groups = [0, 1].map((t) => {
    const cards = teamMembers(t).map((i) => shooterCard(i, stand)).join("");
    return '<section class="group"><h2>' + esc(displayTeam(t)) + "</h2>" + cards + "</section>";
  }).join("");
  return '<header class="sticky"><p class="brand">8-man sporting clays</p><div class="standnav">' +
    '<button type="button" class="jump" data-act="prev">Prev</button><div class="standmid"><div class="standnum">' + (stand + 1) +
    '</div><div class="standof">of 18</div></div><button type="button" class="jump" data-act="next">Next</button></div>' +
    '<div class="dots">' + dots + "</div></header>" + groups +
    '<p class="hint">Tap 0 through 6. Up to 6 hits on a stand. Tap the same number again to clear it. A blank is not a zero. The number on the right is hits so far. Change a name or a team on the Names tab.</p>';
}
function resultRow(r, extra) {
  const cls = r.win ? "win" : (r.lead ? "lead" : "");
  const pill = r.win ? '<span class="pill win">WIN</span>' : (r.lead ? '<span class="pill lead">LEAD</span>' : "");
  return '<article class="row ' + cls + '"><div class="topline"><span class="name">' + esc(r.name) + "</span>" + pill +
    '</div><div class="sub">' + extra + "</div></article>";
}
function renderResults() {
  const people = board();
  const teams = teamBoard();
  const teamRows = teams.rows.map((r) => {
    const score = r.birds ? (r.hits + " hit" + (r.hits === 1 ? "" : "s")) : "no birds yet";
    return resultRow(r, score + " · " + esc(r.names.join(", ")));
  }).join("");
  const personRows = people.rows.map((r) => {
    const score = r.birds ? (r.hits + " hit" + (r.hits === 1 ? "" : "s")) : "no birds yet";
    return resultRow(r, esc(r.team) + " · " + score + " · " + r.birds + " of 18 stands");
  }).join("");
  const teamNote = teams.uneven ? '<p class="note">The two teams do not have the same number of stands in yet.</p>' : "";
  const personNote = people.uneven ? '<p class="note">Someone is missing a stand the others already have, so the lead is not a fair card yet.</p>' : "";
  const pay = people.final ? "" : '<p class="note">WIN is the card. It waits until all eight shooters have all 18 stands. LEAD is only the running total.</p>';
  return '<div class="pagehead"><h1>Results</h1><p>Two teams of four, then each shooter. Highest hits wins when that card is full.</p></div>' +
    '<section class="section"><h2>Teams</h2>' + teamRows + teamNote + "</section>" +
    '<section class="section"><h2>Shooters</h2>' + personRows + personNote + "</section>" +
    pay +
    '<div class="actions"><button type="button" data-act="share">Share results</button></div>';
}
function renderNames() {
  const blocks = [0, 1].map((t) => {
    const people = teamMembers(t).map((i) =>
      '<article class="person"><input class="nm" data-field="name" data-i="' + i + '" value="' + esc(state.names[i]) + '" maxlength="24" enterkeyhint="done" autocomplete="off" autocapitalize="words" aria-label="Shooter ' + (i + 1) + ' name" placeholder="Shooter ' + (i + 1) + '"></article>'
    ).join("");
    return '<section class="group"><div class="teamwrap"><input class="team" data-field="team" data-t="' + t + '" value="' + esc(state.teams[t]) + '" maxlength="24" enterkeyhint="done" autocomplete="off" autocapitalize="words" aria-label="Team ' + (t + 1) + ' name" placeholder="Team ' + (t + 1) + '"></div>' + people + "</section>";
  }).join("");
  return '<div class="pagehead"><h1>Names</h1><p>Eight shooters. The first four are one team. The next four are the other. Type over a name. This phone keeps one round.</p></div>' +
    blocks +
    '<div class="actions"><button type="button" class="danger" data-act="clear">Clear this round</button></div>';
}
function render() {
  if (TEST) return;
  setTabs();
  const name = tabName();
  document.getElementById("app").innerHTML = name === "results" ? renderResults() : (name === "names" ? renderNames() : renderScore());
}
function setHit(i, n) {
  const cur = state.scores[i][state.stand];
  state.scores[i][state.stand] = cur === n ? null : n;
  save();
  render();
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    area.remove();
    return ok;
  }
}
document.getElementById("app").addEventListener("click", async (event) => {
  const el = event.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "prev") state.stand = Math.max(0, state.stand - 1);
  if (act === "next") state.stand = Math.min(STANDS - 1, state.stand + 1);
  if (act === "goto") state.stand = clamp(el.dataset.stand, 0, STANDS - 1, state.stand);
  if (act === "hit") { setHit(Number(el.dataset.i), Number(el.dataset.n)); return; }
  if (act === "clear") {
    if (!confirm("Clear every stand score? Names stay.")) return;
    state.scores = Array.from({ length: N }, () => Array(STANDS).fill(null));
    state.stand = 0;
  }
  if (act === "share") {
    const text = shareText();
    if (navigator.share) {
      try { await navigator.share({ title: "8-man clays", text }); return; }
      catch (e) { /* fall through */ }
    }
    const ok = await copyText(text);
    alert(ok ? "Results copied." : text);
    return;
  }
  if (act === "prev" || act === "next" || act === "goto" || act === "clear") {
    save();
    render();
  }
});
document.getElementById("app").addEventListener("input", (event) => {
  const el = event.target;
  if (el.dataset.field === "name") state.names[Number(el.dataset.i)] = el.value.slice(0, 24);
  if (el.dataset.field === "team") state.teams[Number(el.dataset.t)] = el.value.slice(0, 24);
  if (el.dataset.field === "name" || el.dataset.field === "team") save();
});
window.addEventListener("hashchange", render);

function runTests() {
  const fails = [];
  function eq(name, got, want) {
    if (JSON.stringify(got) !== JSON.stringify(want)) fails.push(name + " got " + JSON.stringify(got) + " want " + JSON.stringify(want));
  }
  state = fresh();
  eq("blank not done", cardDone(0), false);
  eq("no win yet", board().rows.some((r) => r.win), false);
  eq("blank team", displayTeam(0), "Team 1");
  eq("blank shooter", displayName(0), "Shooter 1");
  state.scores[0][0] = 0;
  eq("zero counts", entered(0), 1);
  eq("zero hits", raw(0), 0);
  eq("seven rejected", sanitize({ version: 2, names: [], scores: [[7]], stand: 0 }).scores[0][0], null);
  const moved = sanitize({
    version: 1,
    shooters: [{ name: "Cole Ryan", pair: "B", gauge: 20 }],
    scores: [[5]],
    stand: 3
  });
  eq("old name", moved.names[0], "Cole Ryan");
  eq("old score", moved.scores[0][0], 5);
  eq("old stand", moved.stand, 3);
  eq("old teams blank", moved.teams, ["", ""]);
  const full = fresh();
  full.teams = ["Red", "Blue"];
  full.names = ["Ann", "Bob", "Cara", "Dan", "Eve", "Finn", "Gia", "Hal"];
  for (let i = 0; i < N; i++) for (let st = 0; st < STANDS; st++) full.scores[i][st] = i < TEAM ? 6 : 4;
  state = full;
  eq("ann hits", raw(0), 108);
  eq("red total", teamBoard().rows[0].hits, 432);
  eq("team winner", teamBoard().rows.filter((r) => r.win).map((r) => r.name), ["Red"]);
  eq("shooter winners", board().rows.filter((r) => r.win).map((r) => r.name).sort(), ["Ann", "Bob", "Cara", "Dan"]);
  full.scores[4] = full.scores[0].slice();
  full.scores[5] = full.scores[0].slice();
  full.scores[6] = full.scores[0].slice();
  full.scores[7] = full.scores[0].slice();
  eq("team tie", teamBoard().rows.filter((r) => r.win).map((r) => r.name).sort(), ["Blue", "Red"]);
  const mid = fresh();
